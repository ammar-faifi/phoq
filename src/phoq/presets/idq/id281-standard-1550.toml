# ID Quantique ID281 — superconducting nanowire single-photon detector (SNSPD), one standard single pixel used at 1550 nm.
# Values are the brochure's, at the conditions quoted next to each one; "p. N" is the brochure's page (the
# specifications table and its notes are on p. 4).
schema = 1
id = "idq/id281-standard-1550"
component = "SinglePhotonDetector"
title = "IDQ ID281 SNSPD (standard, 1550 nm)"
vendor = "ID Quantique"
description = "Superconducting nanowire SPD in a closed-cycle cryostat: one standard single pixel, 1300 nm to > 1600 nm band, single-mode fiber, latch-free"
tier = "datasheet"
tags = ["SNSPD", "superconducting", "free-running", "1550"]
notes = """
The ID281 is a system: up to 16 SNSPDs (p. 3, p. 4) in a closed-cycle cryostat, either the ID281 SO (sorption, below
1 K) or the ID281 CO (continuous operation, above 2 K); both reach the table's performance (notes 5 and 6). The
brochure gives no ordering codes. This preset is one standard single-pixel detector ("excellent overall performance",
p. 3) used at 1550 nm, in the 1300 nm to > 1600 nm dark-count row. The Parallel (> 250 Mcps, recovery < 10 ns) and
Multi-Pixel (> 1 Gcps across all pixels) detectors, which resolve photon numbers, and the polarization-insensitive
spirals are other designs.

The preset takes the one operating point the brochure gives: the p. 2 bias sweep of an ID281 SNSPD at 1550 nm, whose
caption does not name its design. Its 26.5 µA marker reads 95.6 % SDE with 14 Hz of dark counts, entered as 96 % and
14 Hz. That is a best-case device: the same page's expected SDE band for the longest-wavelength design reads ≈ 84 % to
92 % at 1550 nm, and the p. 4 table, with ranges over designs and wavelengths and no typical efficiency or dark count,
guarantees only 80 % peak SDE and < 100 cps in this band. The efficiency and the dark counts both rise with the bias
current, a trade-off phoq does not have: set efficiency and dark_count_rate together, at your unit's operating point.

The ID281 is latch-free by design at any detection rate (p. 1, p. 3), and phoq does not model latching, so nothing is
lost there. The brochure names no fiber connector, so the preset leaves phoq's default (FC/UPC): set connector to your
system's. It gives no absolute maximum ratings.
"""

[source]
title = "ID281 Superconducting Nanowire Series brochure"
vendor_url = "https://www.idquantique.com"
