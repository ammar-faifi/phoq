# ID Quantique ID Qube NIR Free-Running, ultra-low-noise model (ULN) — InGaAs/InP SPAD, fiber-coupled version (MMF).
# Values are the brochure's, at the conditions quoted next to each one; "p. N" is the brochure's page (the
# specifications table and its notes are on p. 4).
schema = 1
id = "idq/id-qube-nir-fr-uln"
component = "SinglePhotonDetector"
title = "IDQ ID Qube NIR FR (ultra-low noise)"
vendor = "ID Quantique"
part_number = "ID Qube-NIR-FR-MMF-ULN"
description = "Cooled InGaAs/InP SPAD, 900–1700 nm, free-running or gated, MMF62.5 fiber input, ultra-low-noise model (ULN)"
tier = "datasheet"
tags = ["InGaAs", "SPAD", "free-running", "gated", "1550"]
notes = """
Ordering code ID Qube-NIR-FR-XX-YY (p. 1): XX = MMF (fiber-coupled, "compatible with SMF and MMF FC/PC couplers") or
FS (free space), YY = LN (low noise) or ULN (ultra-low noise). This is the MMF version, since phoq's detector takes a
fiber. The low-noise model is idq/id-qube-nir-fr-ln: the table (p. 4) gives the two models the same rows except the
dark counts and the cooling time at power-on.

The efficiency is set in levels calibrated at 1550 nm: 10, 15, 20 and 25 % (p. 4). The preset sets 25 %, the level the
timing jitter is specified at. Maximum dark count rate at 10, 15, 20 and 25 %: ULN 0.3, 0.5, 0.8 and 1.2 kHz; LN 0.5,
1, 1.5 and 2 kHz; free running with a 50 µs dead time (note 3). For another level, set efficiency and dark_count_rate
together. The extended levels, 30 and 35 %, come without a guarantee of the noise performance: above 25 % the
afterpulsing becomes non-negligible and the dark counts can rise significantly, while the timing jitter has been
observed to improve (note 2). Further levels can be calibrated on demand (note 1).

The p. 2 figure of dark counts and jitter against efficiency is not used. It has no legend: its "Low-noise" and "Ultra
Low-noise" labels sit near the markers at 25–26 %. Its upper triangles (≈ 0.56, 1.0, 1.9 and 3.6 kHz at 10, 15, 20 and
26 %) are at or above the table's LN maxima, clearly above at 20 and 26 %; its lower triangles (≈ 0.20, 0.56, 1.0 and
1.8 kHz) are above the ULN maxima at 20 and 26 %; a red cross at 25 % reads ≈ 0.9 kHz on the dark-count axis (≈ 200 ps
on the jitter axis), under the ULN maximum. phoq does not model afterpulsing, so a dead time shorter than the
dark-count rows' 50 µs adds no afterpulses in the model. The brochure gives no absolute maximum ratings, so no maximum
optical input either.
"""

