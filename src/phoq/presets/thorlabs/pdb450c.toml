# Thorlabs PDB450C — Switchable-gain balanced amplified photodetector, InGaAs, 800–1700 nm, DC–150 MHz.
schema = 1
component = "BalancedPhotodetector"
title = "Thorlabs PDB450C"
vendor = "Thorlabs"
part_number = "PDB450C"
description = "Switchable-gain balanced amplified photodetector, InGaAs, 800–1700 nm, DC–150 MHz"
tier = "datasheet"
tags = ["InGaAs", "balanced", "switchable gain", "1550"]
notes = """
Gain switch 10³–10⁷ V/A: the bandwidth falls from 150 MHz to 0.1 MHz as the gain rises. Keep the inputs'
power difference below the CW saturation power (4.5 mW at 1550 nm and 10³ V/A). Damage threshold 20 mW per photodiode.
"""

[source]
title = "PDB440x and PDB450x Balanced Amplified Photodetectors — Operation Manual"
url = "https://www.thorlabs.com/balanced-amplified-photodetectors-with-fast-monitor-output"
document = "21709-d02.pdf"
revision = "Version 2.4, 08-Apr-2019, Item No. M0009-510-1043"
accessed = 2026-10-21
conditions = "Gains, conversion gains and swings for a high-impedance load (half into 50 Ω)"

[params]
gain = { value = 1e4, from = "assumed", spec = "Gain switch position", note = "Any of gain_settings; set it like the front-panel switch" }
gain_settings = { value = "1e3:150e6:68.6e-12:4.6, 1e4:45e6:14.9e-12:4.6, 1e5:4e6:1.55e-12:4.6, 1e6:0.3e6:0.5e-12:4.6, 1e7:0.1e6:0.7e-12:10", from = "datasheet-typ", spec = "5.1.2: Transimpedance Gain 10³–10⁷ V/A; RF OUTPUT Bandwidth (−3 dB) DC–150/45/4/0.3/0.1 MHz; Minimum NEP per gain; 5.1 RF Voltage Swing ±4.6 V (10³–10⁶), ±10 V (10⁷)", note = "NEP is the datasheet minimum over DC to each bandwidth" }
cmrr_db = { value = 30.0, from = "datasheet-typ", spec = "5.1.2 CMRR > 25 dB (typ. > 30 dB)" }
material = { value = "InGaAs", from = "datasheet-typ", spec = "5.1.1/5.1.2 Detector Material / Type: InGaAs / PIN" }
ref_responsivity = { value = 1.0, from = "datasheet-typ", spec = "Max. Responsivity, typ." }
ref_wavelength = { value = 1550e-9, from = "datasheet-graph", spec = "Peak of the typical responsivity curve, 5.1" }
connector = { value = "FC/PC", from = "datasheet-typ", spec = "3.2: FC receptacles for FC/PC or FC/APC; the C models are aligned for SMF-28 with PC connectors", note = "The receptacle faces a photodiode window, not a fiber: an FC/APC cord also works there, but phoq mates connectors as fiber to fiber and would flag it" }
rf_impedance = { value = 50.0, from = "datasheet-typ", spec = "5.1 RF OUTPUT Impedance 50 Ω" }
monitor_gain = { value = 1e+04, from = "derived", spec = "5 Appendix: monitor conversion gain 10 V/mW at peak responsivity, high-impedance load", note = "10 V/mW ÷ 1.0 A/W" }
monitor_bandwidth = { value = 1e6, from = "datasheet-typ", spec = "5.1 MONITOR Outputs Bandwidth DC to 1 MHz" }
monitor_swing = { value = 10.0, from = "datasheet-max", spec = "5.1 MONITOR Voltage Swing, max. 10 V (high-impedance load)" }
monitor_impedance = { value = 220.0, from = "datasheet-typ", spec = "5.1 MONITOR Outputs Impedance 220 Ω" }
monitor_noise = { value = 180e-6, from = "datasheet-max", spec = "5.1 MONITOR Voltage Noise < 180 µV RMS" }

[curves.responsivity]
from = "datasheet-graph"
spec = "5.1 Typical InGaAs Detector responsivity (PDA440C, PDB450C)"
note = "Traced by color from the published plot (±0.005 A/W)."
wavelength_nm = [800, 825, 850, 875, 900, 925, 950, 975, 1000, 1025, 1050, 1075, 1100, 1125, 1150, 1175, 1200, 1225, 1250, 1275, 1300, 1325, 1350, 1375, 1400, 1425, 1450, 1475, 1500, 1525, 1550, 1575, 1600, 1625, 1650, 1675, 1700, 1725, 1750, 1775, 1800]
value = [0.149, 0.174, 0.22, 0.284, 0.368, 0.523, 0.617, 0.659, 0.682, 0.699, 0.714, 0.731, 0.747, 0.766, 0.785, 0.804, 0.827, 0.861, 0.901, 0.928, 0.948, 0.961, 0.973, 0.984, 0.993, 1.002, 1.01, 1.018, 1.027, 1.033, 1.038, 1.036, 1.022, 0.993, 0.932, 0.493, 0.156, 0.048, 0.013, 0.007, 0.006]

[limits]
optical_input_w = 20e-3

[unsupported]
rf_dc_offset_v = { max = 15e-3, note = "RF OUTPUT DC offset < ±15 mV; not modeled" }
monitor_dc_offset_v = { max = 2e-3, note = "< ±2 mV; not modeled" }
cw_saturation_w = "4.5 mW @ 1550 nm (10³ V/A) — the model derives it as swing/(G·ℜ) at the selected gain"
ac_coupled_version = "-AC versions: lower cut-off ≤ 100 Hz (typ. < 5 Hz); the model is DC-coupled"
active_area_diameter_m = { typ = 0.3e-3 }
frequency_response = "Measured responses roll off faster than the model's single pole, and the 10³ V/A setting peaks near 100 MHz"
