# Micro Photon Devices PDM-IR — InGaAs/InP SPAD photon-counting module, SMF-28 pigtail, desktop instrument (DI).
# Values are the datasheet's, at the conditions quoted next to each one; "p. N" is the datasheet page.
schema = 1
id = "mpd/pdm-ir"
component = "SinglePhotonDetector"
title = "MPD PDM-IR (SMF-28, desktop)"
vendor = "Micro Photon Devices"
part_number = "$PI-010-SM-DI"
description = "Peltier-cooled InGaAs/InP SPAD, 900–1700 nm, free-running or gated, SMF-28 pigtail, desktop instrument"
tier = "datasheet"
tags = ["InGaAs", "SPAD", "free-running", "gated", "1550"]
notes = """
The small form factor with the same 10 µm SPAD, $PI-010-SM, is mpd/pdm-ir-sff (DCR 0.5 kcps typ / 1.2 max,
case-temperature dependent). Also on the datasheet: $PI-025-MM and -MM-DI (50 µm graded-index multimode fiber,
25 µm SPAD, DCR 2.6 kcps typ / 5 max, jitter 130 ps typ). The datasheet specifies the PDE at 7 V excess bias and
the DCR at 2 V, so a unit run at full PDE will count more dark counts than this preset; set dark_count_rate from
the DCR-vs-hold-off curves (p. 2) for the bias you use. The datasheet gives no absolute maximum optical input; its
warranty refers to absolute maximum ratings (p. 4), and note 1 (p. 3) to the user manual for the full specifications.
"""

[source]
title = "PDM-IR datasheet, fiber-pigtailed versions"
vendor_url = "https://www.micro-photon-devices.com"
document = "MPD_PDM-IR_Datasheet_Fiber.pdf"
revision = "v2.1, February 2025"
accessed = 2026-10-16
conditions = "SMF-28 pigtail (10 µm SPAD); each row's own excess bias V_EX and mode"

[params]
connector = { value = "FC/PC", from = "datasheet-typ", spec = "p. 3, Fiber pigtail type: FC/PC, SMF-28 (10 µm SPAD)", note = "The pigtail stays inside the case and is reached through an FC/PC barrel on the front panel (p. 2)" }
efficiency = { value = 0.25, from = "datasheet-typ", spec = "p. 3, Photon detection efficiency, V_EX = 7 V (fixed-gate mode only), 1550 nm", note = "Free-running and free-gate modes are limited to V_EX = 5 V (p. 3); the PDE-vs-bias plot (p. 2) gives about 22 % there" }
dark_count_rate = { value = 250.0, from = "datasheet-typ", spec = "p. 3, DCR, SMF-28 DI, V_EX = 2 V, SPAD temperature 'Low', free running, hold-off 100 µs", max = 600.0, note = "Rises with V_EX and as the hold-off is shortened (afterpulsing, not modeled)" }
ref_wavelength = { value = 1550e-9, from = "datasheet-condition", spec = "p. 3, PDE is specified at λ = 1550 nm" }
dead_time = { value = 100e-6, from = "datasheet-typ", spec = "p. 3, Hold-off time at which the DCR is specified; software-selectable 1 µs … 3 ms in 10 ns steps", min = 1e-6, max = 3e-3 }
timing_jitter = { value = 200e-12, from = "datasheet-typ", spec = "p. 3, Timing jitter (FWHM), V_EX = 4 V (all working modes), 10 µm SPAD", min = 130e-12, note = "At V_EX = 7 V (fixed-gate mode only): 100 ps typ, 70 ps min (p. 3). The model's jitter is a Gaussian: the IRF's exponential decay (60 ps typ, 100 ps max, p. 3) and the secondary bump above 6 V (note 3, p. 3) are not modeled" }

[curves.efficiency]
from = "datasheet-graph"
spec = "p. 1, PDE vs wavelength, SMF-28 version (one plot for DI and SFF), V_EX = 6 V series (the closest to the 7 V of the PDE specification)"
note = "The 3–6 V series have the same shape; the plot's 6 V series reads ≈ 25.8 % at 1550 nm and the model scales it to the table's 25 %. Sensitivity 900–1700 nm."
wavelength_nm = [800, 825, 850, 875, 900, 925, 950, 975, 1000, 1025, 1050, 1075, 1100, 1125, 1150, 1175, 1200, 1225, 1250, 1275, 1300, 1325, 1350, 1375, 1400, 1425, 1450, 1475, 1500, 1525, 1550, 1575, 1600, 1625, 1650, 1675, 1700]
value = [0.0008, 0.0019, 0.0043, 0.0082, 0.0183, 0.0579, 0.0788, 0.0983, 0.1146, 0.1305, 0.1487, 0.1666, 0.1907, 0.214, 0.2404, 0.2617, 0.2901, 0.3157, 0.3437, 0.3538, 0.3647, 0.3662, 0.367, 0.3685, 0.3546, 0.3616, 0.3623, 0.3631, 0.3483, 0.3134, 0.2575, 0.1899, 0.1289, 0.0866, 0.0447, 0.0198, 0.0035]

[unsupported]
irf_decay_time_s = { typ = 60e-12, max = 100e-12, note = "p. 3, V_EX = 4 V; longer below 975 nm. The model's timing jitter is a Gaussian, without this tail" }
gating = "p. 3: gate width 1 ns … 1.5 ms (p. 1's feature list says 1 ns to 10 µs), gate repetition up to 100 MHz, internal or external trigger with programmable delays. Only free-running operation is modeled"
afterpulsing = "Not specified beyond the DCR-vs-hold-off curves (p. 2); not modeled"
spad_temperature_k = { min = 225, max = 243, note = "p. 3, four software-selectable values; not modeled" }
output_pulse = "p. 3, PHOTON OUT: NIM (−800 mV into 50 Ω) or TTL, 10 ns; the model emits 1 V, 5 ns pulses"
