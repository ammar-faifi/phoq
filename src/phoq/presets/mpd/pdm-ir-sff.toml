# Micro Photon Devices PDM-IR — InGaAs/InP SPAD photon-counting module, SMF-28 pigtail, small form factor (SFF).
# Values are the datasheet's, at the conditions quoted next to each one; "p. N" is the datasheet page.
schema = 1
id = "mpd/pdm-ir-sff"
component = "SinglePhotonDetector"
title = "MPD PDM-IR (SMF-28, small form factor)"
vendor = "Micro Photon Devices"
part_number = "$PI-010-SM"
description = "Peltier-cooled InGaAs/InP SPAD, 900–1700 nm, free-running or gated, exposed SMF-28 pigtail, small form factor"
tier = "datasheet"
tags = ["InGaAs", "SPAD", "free-running", "gated", "1550"]
notes = """
The desktop instrument with the same 10 µm SPAD, $PI-010-SM-DI, is mpd/pdm-ir. Both versions share the datasheet's
SPAD specifications except the dark counts: the small form factor lacks the desktop's additional thermal loop against
the SPAD package's black-body radiation (p. 2), and its DCR is twice the desktop's (p. 3) and depends on the case
temperature (p. 2). The datasheet specifies the PDE at 7 V excess bias and the DCR at 2 V, so a unit run at full PDE
will count more dark counts than this preset. The DCR-vs-hold-off curves (p. 2) are for "a typical 10 µm device",
form factor not stated: at 2 V they read 0.18 kcps at 100 µs, below either version's typical DCR. The datasheet gives
no absolute maximum optical input; its warranty refers to absolute maximum ratings (p. 4), and note 1 (p. 3) to the
user manual for the full specifications.
"""

[source]
title = "PDM-IR datasheet, fiber-pigtailed versions"
vendor_url = "https://www.micro-photon-devices.com"
document = "MPD_PDM-IR_Datasheet_Fiber.pdf"
revision = "v2.1, February 2025"
accessed = 2026-11-10
conditions = "SMF-28 pigtail (10 µm SPAD), small form factor; each row's own excess bias V_EX and mode"

[params]
connector = { value = "FC/PC", from = "datasheet-typ", spec = "p. 3, Fiber pigtail type: FC/PC, SMF-28 (10 µm SPAD)", note = "The pigtail leaves the case and ends in an FC/PC connector with a narrow plug key (p. 4 drawing)" }
efficiency = { value = 0.25, from = "datasheet-typ", spec = "p. 3, Photon detection efficiency, V_EX = 7 V (fixed-gate mode only), 1550 nm", note = "Free-running and free-gate modes are limited to V_EX = 5 V (p. 3); the PDE-vs-bias plot (p. 2) gives about 22 % there" }
dark_count_rate = { value = 500.0, from = "datasheet-typ", spec = "p. 3, DCR, SMF-28 SFF, V_EX = 2 V, SPAD temperature 'Low', free running, hold-off 100 µs, case temperature 25 °C", max = 1200.0, note = "Depends on the case temperature (p. 2); rises with V_EX and as the hold-off is shortened (afterpulsing, not modeled)" }
ref_wavelength = { value = 1550e-9, from = "datasheet-condition", spec = "p. 3, PDE is specified at λ = 1550 nm" }
dead_time = { value = 100e-6, from = "datasheet-typ", spec = "p. 3, Hold-off time at which the DCR is specified; software-selectable 1 µs … 3 ms in 10 ns steps", min = 1e-6, max = 3e-3 }

[curves.efficiency]
from = "datasheet-graph"
spec = "p. 1, PDE vs wavelength, SMF-28 version (one plot for DI and SFF), V_EX = 6 V series (the closest to the 7 V of the PDE specification)"
note = "The 3–6 V series have the same shape; the plot's 6 V series reads ≈ 25.8 % at 1550 nm and the model scales it to the table's 25 %. Sensitivity 900–1700 nm."
wavelength_nm = [800, 825, 850, 875, 900, 925, 950, 975, 1000, 1025, 1050, 1075, 1100, 1125, 1150, 1175, 1200, 1225, 1250, 1275, 1300, 1325, 1350, 1375, 1400, 1425, 1450, 1475, 1500, 1525, 1550, 1575, 1600, 1625, 1650, 1675, 1700]
value = [0.0008, 0.0019, 0.0043, 0.0082, 0.0183, 0.0579, 0.0788, 0.0983, 0.1146, 0.1305, 0.1487, 0.1666, 0.1907, 0.214, 0.2404, 0.2617, 0.2901, 0.3157, 0.3437, 0.3538, 0.3647, 0.3662, 0.367, 0.3685, 0.3546, 0.3616, 0.3623, 0.3631, 0.3483, 0.3134, 0.2575, 0.1899, 0.1289, 0.0866, 0.0447, 0.0198, 0.0035]

[unsupported]
timing_jitter_fwhm_s = { typ = 200e-12, note = "p. 3, V_EX = 4 V, all modes; 100 ps typ at 7 V in fixed-gate mode. The click model has no timing jitter: a click lands in its laser time bin" }
irf_decay_time_s = { typ = 60e-12, max = 100e-12, note = "p. 3, V_EX = 4 V; longer below 975 nm" }
gating = "p. 3: gate width 1 ns … 1.5 ms (p. 1's feature list says 1 ns to 10 µs), gate repetition up to 100 MHz, internal or external trigger with programmable delays. Only free-running operation is modeled"
afterpulsing = "Not specified beyond the DCR-vs-hold-off curves (p. 2); not modeled"
spad_temperature_k = { min = 225, max = 243, note = "p. 3, four software-selectable values; not modeled" }
output_pulse = "p. 3, PHOTON OUT: NIM (−800 mV into 50 Ω) or TTL, 10 ns; the model emits 1 V, 5 ns pulses"
case_temperature = "p. 2: no additional thermal loop, so the DCR depends on the case temperature; p. 3: the table's DCR is at a 25 °C case. Not modeled"
exposed_pigtail = "p. 3, note 2: the exposed fiber is not light-tight; shield it completely for any measurement, the DCR included. Light it picks up is not modeled"
