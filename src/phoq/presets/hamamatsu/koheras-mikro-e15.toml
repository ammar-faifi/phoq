# Hamamatsu (formerly NKT Photonics) Koheras MIKRO E15 — 1550 nm single-frequency DFB fiber
# laser, 40 mW (Koheras MIKRO datasheet).
schema = 1
id = "hamamatsu/koheras-mikro-e15"
component = "Laser"
title = "Koheras MIKRO E15"
vendor = "Hamamatsu Photonics"
part_number = "Koheras MIKRO E15"
description = "Compact low-noise 1.5 µm OEM single-frequency fiber laser, 40 mW, linewidth < 100 Hz"
tier = "datasheet"
tags = ["fiber laser", "DFB", "single-frequency", "narrow linewidth", "1550", "CW", "sensing"]
notes = """
Koheras lasers move from NKT Photonics to Hamamatsu Photonics; the datasheet says some documents
still carry the NKT name. The E15 is the full-specification model: 40 mW (adjustable), any center
wavelength in 1535–1580 nm on request (optionally 1064 nm), 1550.12 nm standard. The A15 is the
10 mW, 1550.12 nm-only model with reduced optical specifications (hamamatsu/koheras-mikro-a15).
Two figures map onto phoq's laser, which has white frequency noise and white intensity noise:
- linewidth: the datasheet's < 0.1 kHz is measured with 120 µs integration. The frequency noise
  falls with frequency (1/f-like, see [unsupported]), so the linewidth grows with the
  integration time; phoq's Lorentzian of 100 Hz is that figure, not an intrinsic linewidth.
- rin_db_hz: the level at 10 MHz, above the relaxation-oscillation peak at about 0.7 MHz, where
  the datasheet allows up to −100 dBc/Hz. Below a few MHz the real laser is far noisier than
  the white model.
The phase-noise column is per meter of interferometer imbalance, and the frequency-noise column
is the same numbers converted with the fiber's group delay: S_φ^½ = 2π·τ·S_ν^½, τ = 4.90 ns/m.
Class 3B laser product.
"""

[source]
title = "Koheras MIKRO — Compact low-noise 1.5 µm OEM fiber laser"
vendor_url = "https://www.hamamatsu.com"
document = "Koheras MIKRO Datasheet.pdf"
revision = "Koheras MIKRO 20260529"
accessed = 2026-10-25
conditions = "free-running, 1550.12 nm standard module"

[params]
wavelength = { value = 1550.12e-9, from = "datasheet-typ", spec = "Standard wavelengths: 1550.12 nm", note = "Other wavelengths 1535–1580 nm on request, optionally 1064 nm" }
power_dbm = { value = 16.02, from = "datasheet-typ", spec = "Output power: 40 mW (adjustable)", note = "40 mW = 16.02 dBm; the output power is adjustable, so lower settings are the same laser" }
mode = { value = "cw", from = "datasheet-typ", spec = "Laser emission: continuous wave, inherently single frequency" }
linewidth = { value = 100.0, from = "datasheet-max", spec = "Linewidth [kHz] < 0.1, 120 µs integration time", note = "phoq's linewidth is a Lorentzian (white frequency noise); the real frequency noise is not white (see [unsupported])" }
rin_db_hz = { value = -135.0, from = "datasheet-max", spec = "RIN level < −135 dBc/Hz @ 10 MHz", note = "phoq's RIN is white; the relaxation peak at about 0.7 MHz (< −100 dBc/Hz) is not modeled" }
connector = { value = "FC/APC", from = "datasheet-typ", spec = "Optical output, standard: FC/APC pigtail, 0.5 m" }

[limits]
operating_temperature_c = [15.0, 60.0]
humidity_rh_percent = [0.0, 70.0]

[unsupported]
rin_peak_frequency_hz = { typ = 0.7e6, note = "RIN peak (relaxation oscillation) at approximately 0.7 MHz" }
rin_at_peak_dbc_hz = { max = -100.0, note = "RIN level < −100 dBc/Hz at the peak; phoq's RIN is white at the 10 MHz level" }
phase_noise_db_rad_rthz_per_m = { note = "Max. phase noise, per meter of interferometer imbalance: −90 @ 10 Hz, −110 @ 100 Hz, −120 @ 1 kHz, −130 @ 20 kHz [dB((rad/√Hz)/m)]" }
frequency_noise_hz_rthz = { note = "Max. frequency noise: 1027.7 @ 10 Hz, 102.8 @ 100 Hz, 32.5 @ 1 kHz, 10.3 @ 20 kHz [Hz/√Hz]; phoq's phase walk has white frequency noise only" }
optical_snr_db = { min = 50.0, typ = 55.0, note = "Optical S/N at 50 pm resolution (> 47, typ. > 52 dB for the non-PM version); phoq's laser has no ASE background" }
m2 = { max = 1.05, note = "Beam quality M² < 1.05; phoq propagates one fiber mode" }
thermal_tuning_m = { min = 350e-12, note = "Min. thermal wavelength tuning ±350 pm (about ±44 GHz at 1550 nm), relative to the center at room temperature; total range 1000 pm. phoq's detuning sets a fixed offset" }
fast_wavelength_modulation = { note = "Option: > 8 GHz range, up to 20 kHz; for locking to an external reference" }
pm_output_per_db = { min = 23.0, note = "Option: polarization-maintaining output, PER > 23 dB; phoq has no polarization" }
pigtail_length_m = { typ = 0.5, note = "The 0.5 m output pigtail's delay is not part of the laser model; connect a 0.5 m cord to include it" }
supply = "12 VDC; power consumption typ. 4 W, max. 10 W; RS-485 interface"
dimensions_mm = "70 × 20 × 150, 0.35 kg"
