name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and the project
        run: |
          uv python install 3.14
          uv sync --locked --all-extras --dev

      - name: Run the tests
        run: uv run pytest -q

      - name: Build the distributions
        run: uv build
